<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GL Capacita</title>
<meta name="theme-color" content="#1F4E6E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* GL Capacita — estilos */
.rev-q { border-top: 1px solid var(--bruma-2); padding: 10px 0; }
.rev-q ol { margin: 6px 0 8px 20px; padding: 0; }
.rev-ok { color: var(--alga); font-weight: 600; }
#demo-banda a { color: inherit; font-weight: 600; }
:root {
  --fiordo: #1F4E6E;
  --fiordo-2: #2F6B92;
  --fiordo-3: #5F95BA;
  --bruma: #EAF1F6;
  --bruma-2: #D3E1EB;
  --papel: #FFFFFF;
  --tinta: #16262D;
  --roca: #55666D;
  --chaleco: #E07F1F;
  --chaleco-osc: #B8640F;
  --alga: #2F7D6D;
  --alga-claro: #DCEFEA;
  --boya: #F2C230;
  --boya-claro: #FDF3D3;
  --error: #B3261E;
  --error-claro: #FBE4E2;
  --radio: 14px;
  --sombra: 0 1px 2px rgba(31, 78, 110, .08), 0 4px 14px rgba(31, 78, 110, .06);
  --fuente: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --fuente-c: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bruma); color: var(--tinta); font-family: var(--fuente); font-size: 17px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--fiordo-2); }
:focus-visible { outline: 3px solid var(--chaleco); outline-offset: 2px; }
.oculto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* barra superior */
.barra { background: var(--fiordo); color: #fff; position: sticky; top: 0; z-index: 20; }
.barra-in { max-width: 680px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; min-height: 56px; }
.marca { white-space: nowrap; font-family: var(--fuente-c); font-weight: 700; font-size: 22px; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
.marca svg { flex: none; }
.barra .esp { flex: 1; }
.btn-barra { background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 10px; padding: 6px 12px; font-size: 15px; cursor: pointer; }
.estado-red { font-size: 13px; flex: none; padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.12); white-space: nowrap; }
.estado-red.off { background: var(--boya); color: var(--tinta); }

main { max-width: 680px; margin: 0 auto; padding: 18px 16px 80px; }
h1, h2, h3 { font-family: var(--fuente-c); line-height: 1.15; margin: 0 0 8px; color: var(--fiordo); }
h1 { font-size: 32px; font-weight: 700; }
h2 { font-size: 25px; font-weight: 700; }
h3 { font-size: 20px; font-weight: 600; }
p { margin: 0 0 12px; }
.suave { color: var(--roca); }
.peq { font-size: 15px; }

.tarjeta { background: var(--papel); border-radius: var(--radio); padding: 18px; box-shadow: var(--sombra); margin-bottom: 14px; }
.tarjeta.plana { box-shadow: none; border: 1px solid var(--bruma-2); }

/* botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 20px; border-radius: 12px; border: 0; cursor: pointer; font-weight: 600; font-size: 17px; text-decoration: none; }
.btn-pri { background: var(--chaleco); color: #fff; }
.btn-pri:hover { background: var(--chaleco-osc); }
.btn-sec { background: var(--papel); color: var(--fiordo); border: 2px solid var(--fiordo); }
.btn-ter { background: transparent; color: var(--fiordo-2); text-decoration: underline; min-height: 44px; padding: 8px 4px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-bloque { width: 100%; }
.fila-btn { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.fila-btn .btn { flex: 1 1 160px; }

/* formularios */
label.campo { display: block; margin-bottom: 14px; font-weight: 600; font-size: 16px; }
label.campo span.ayuda { display: block; font-weight: 400; color: var(--roca); font-size: 14px; }
input[type=text], input[type=tel], input[type=password], input[type=date], input[type=time], select, textarea {
  display: block; width: 100%; margin-top: 6px; padding: 13px 14px; border: 2px solid var(--bruma-2); border-radius: 12px; background: #fff; font-size: 18px;
}
input:focus, select:focus, textarea:focus { border-color: var(--fiordo-2); outline: none; }
.pin { letter-spacing: 10px; font-size: 24px; text-align: center; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; background: var(--bruma); margin: 10px 0; cursor: pointer; font-size: 16px; }
.check input { width: 26px; height: 26px; flex: none; margin-top: 1px; accent-color: var(--alga); }
.aviso { padding: 12px 14px; border-radius: 12px; margin: 12px 0; font-size: 16px; }
.aviso.error { background: var(--error-claro); color: var(--error); }
.aviso.ok { background: var(--alga-claro); color: #1d5a4e; }
.aviso.info { background: var(--boya-claro); color: #5c4700; }

.pestanas { display: flex; background: var(--bruma); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.pestanas button { flex: 1; border: 0; background: transparent; padding: 11px; border-radius: 9px; font-weight: 600; cursor: pointer; color: var(--roca); }
.pestanas button.act { background: #fff; color: var(--fiordo); box-shadow: var(--sombra); }

/* portada */
.portada { background: var(--fiordo); color: #fff; margin: -18px -16px 18px; padding: 26px 20px 92px; position: relative; overflow: hidden; }
.portada h1 { color: #fff; font-size: 40px; margin-bottom: 6px; }
.portada p { color: #cfe0e6; max-width: 32ch; }
.portada svg.olas { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 70px; }
.portada + .tarjeta { margin-top: -70px; position: relative; }

/* cabecera de avance */
.encabezado { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
.encabezado .quien { flex: 1; }
.encabezado .quien h1 { font-size: 28px; margin-bottom: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--bruma-2); border-radius: 99px; padding: 4px 11px; font-size: 14px; color: var(--roca); }
.chip b { color: var(--tinta); font-weight: 600; }
.chip.alerta { background: var(--boya-claro); border-color: #ecd68f; color: #5c4700; }
.chip.peligro { background: var(--error-claro); border-color: #f1b8b3; color: var(--error); }

.medidor { margin: 16px 0 6px; }
.medidor-barra { height: 12px; background: var(--bruma-2); border-radius: 99px; overflow: hidden; }
.medidor-barra i { display: block; height: 100%; background: var(--alga); border-radius: 99px; transition: width .4s; }
.medidor-txt { display: flex; justify-content: space-between; font-size: 14px; color: var(--roca); margin-top: 6px; }

/* derrotero: la ruta del curso */
.derrotero { position: relative; padding-left: 48px; margin-top: 8px; }
.derrotero::before { content: ''; position: absolute; left: 19px; top: 14px; bottom: 30px; border-left: 3px dashed var(--fiordo-3); opacity: .55; }
.tramo { margin: 22px 0 6px -48px; padding-left: 48px; position: relative; }
.tramo h3 { font-size: 17px; letter-spacing: .2px; color: var(--fiordo-2); margin: 0; font-weight: 700; }
.tramo::before { content: ''; position: absolute; left: 12px; top: 3px; width: 17px; height: 17px; background: var(--fiordo); transform: rotate(45deg); border-radius: 3px; }
.etapa { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff; border: 2px solid transparent; border-radius: 14px; padding: 12px 14px; margin: 8px 0; cursor: pointer; box-shadow: var(--sombra); }
.etapa .boya { position: absolute; left: -41px; top: 50%; margin-top: -13px; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--bruma-2); background: var(--bruma); display: flex; align-items: center; justify-content: center; }
.etapa.hecha .boya { background: var(--alga); border-color: var(--alga); }
.etapa.actual { border-color: var(--chaleco); }
.etapa.actual .boya { background: var(--chaleco); border-color: #fff; box-shadow: 0 0 0 3px var(--chaleco); }
.etapa.actual .boya::after { content: ''; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--chaleco); animation: pulso 2.2s ease-out infinite; }
@keyframes pulso { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .etapa.actual .boya::after { animation: none; opacity: 0; } }
.etapa.bloq { cursor: default; box-shadow: none; background: transparent; border-color: var(--bruma-2); color: var(--roca); }
.etapa .ic { width: 38px; height: 38px; flex: none; border-radius: 10px; background: var(--bruma); display: flex; align-items: center; justify-content: center; color: var(--fiordo); }
.etapa.hecha .ic { background: var(--alga-claro); color: var(--alga); }
.etapa.actual .ic { background: #fde5d6; color: var(--chaleco-osc); }
.etapa .tx { flex: 1; min-width: 0; }
.etapa .tt { font-weight: 600; display: block; line-height: 1.25; }
.etapa .mt { font-size: 14px; color: var(--roca); }
.etapa .ir { color: var(--fiordo-3); flex: none; }
.puerto { margin: 22px 0 0 -48px; padding: 18px; border-radius: var(--radio); background: var(--fiordo); color: #fff; }
.puerto h2 { color: #fff; }
.puerto p { color: #cfe0e6; }

/* vistas de etapa */
.volver { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--fiordo-2); font-weight: 600; padding: 8px 0; margin-bottom: 6px; cursor: pointer; font-size: 16px; }
.etiqueta-mod { font-size: 15px; color: var(--roca); margin-bottom: 2px; }

/* reproductor SCORM */
.reproductor { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; }
.reproductor .rp-barra { background: var(--fiordo); color: #fff; display: flex; align-items: center; gap: 10px; padding: 8px 12px; min-height: 52px; }
.reproductor .rp-barra .tt { flex: 1; font-weight: 600; font-size: 15px; line-height: 1.2; }
.reproductor .rp-barra .tm { font-size: 13px; color: #cfe0e6; display: block; font-weight: 400; }
.reproductor iframe { flex: 1; width: 100%; border: 0; background: #000; }
.reproductor .demo-scorm { flex: 1; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 14px; }

/* quiz y juegos */
.progreso-q { font-size: 15px; color: var(--roca); margin-bottom: 8px; }
.pregunta { font-size: 20px; font-weight: 600; line-height: 1.35; margin-bottom: 14px; }
.opcion { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 14px; margin-bottom: 10px; border: 2px solid var(--bruma-2); border-radius: 12px; background: #fff; cursor: pointer; font-size: 17px; }
.opcion .letra { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--bruma); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: var(--fiordo); }
.opcion.sel { border-color: var(--fiordo-2); background: #f2f7f9; }
.opcion.sel .letra { background: var(--fiordo-2); color: #fff; }
.opcion.ok { border-color: var(--alga); background: var(--alga-claro); }
.opcion.ok .letra { background: var(--alga); color: #fff; }
.opcion.no { border-color: var(--error); background: var(--error-claro); }
.opcion[disabled] { cursor: default; }
.retro { padding: 14px; border-radius: 12px; margin: 6px 0 4px; font-size: 16px; }
.retro.ok { background: var(--alga-claro); }
.retro.no { background: var(--boya-claro); }
.retro b { display: block; margin-bottom: 2px; }
.resultado { text-align: center; padding: 10px 0; }
.resultado .cifra { font-family: var(--fuente-c); font-size: 64px; font-weight: 700; color: var(--fiordo); line-height: 1; }

.cat-btns { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 14px; }
@media (min-width: 520px) { .cat-btns { grid-template-columns: 1fr 1fr; } }
.cat-btns .btn { min-height: 50px; font-size: 16px; }
.tarjeta-item { background: #fff; border-radius: 14px; border: 2px solid var(--fiordo-3); padding: 20px; font-size: 19px; font-weight: 500; text-align: center; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.contador { font-size: 14px; color: var(--roca); }

.orden-lista { list-style: none; margin: 0; padding: 0; counter-reset: o; }
.orden-lista li { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--bruma-2); border-radius: 12px; padding: 10px 10px 10px 14px; margin-bottom: 8px; }
.orden-lista li::before { counter-increment: o; content: counter(o); font-family: var(--fuente-c); font-weight: 700; font-size: 22px; color: var(--fiordo-3); width: 22px; }
.orden-lista li .tx { flex: 1; }
.orden-lista li button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--bruma-2); background: var(--bruma); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.orden-lista li.ok { border-color: var(--alga); background: var(--alga-claro); }
.orden-lista li.no { border-color: var(--boya); background: var(--boya-claro); }

.pares { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pares .col { display: flex; flex-direction: column; gap: 8px; }
.par { border: 2px solid var(--bruma-2); background: #fff; border-radius: 12px; padding: 10px; font-size: 15px; text-align: left; cursor: pointer; min-height: 64px; }
.par.sel { border-color: var(--fiordo-2); background: #f2f7f9; }
.par.hecho { border-color: var(--alga); background: var(--alga-claro); cursor: default; }
.par.mal { border-color: var(--error); animation: sacude .3s; }
@keyframes sacude { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.escena { position: relative; width: 100%; border-radius: 14px; overflow-x: auto; overflow-y: hidden; background: #cfe0e6; touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch; }
.escena svg { display: block; width: 100%; min-width: 640px; height: auto; }
@media (min-width: 640px) { .escena svg { min-width: 0; } }
.escena-ayuda { font-size: 14px; color: var(--roca); margin: 6px 0 0; }
@media (min-width: 640px) { .escena-ayuda { display: none; } }
.hs-marca { fill: none; stroke: var(--chaleco); stroke-width: 5; }
.hs-fallo { fill: rgba(179, 38, 30, .25); stroke: var(--error); stroke-width: 2; }
.hallazgos { margin: 10px 0 0; padding-left: 20px; }

.chk-item { display: flex; gap: 12px; align-items: center; padding: 12px; border: 2px solid var(--bruma-2); border-radius: 12px; margin-bottom: 8px; background: #fff; cursor: pointer; }
.chk-item input { width: 26px; height: 26px; accent-color: var(--fiordo-2); flex: none; }
.chk-item.ok { border-color: var(--alga); background: var(--alga-claro); }
.chk-item.no { border-color: var(--error); background: var(--error-claro); }
.chk-item .fb { display: block; font-size: 14px; color: var(--roca); }

/* bloque empresa */
.riesgo { border-left: 5px solid var(--bruma-2); padding: 12px 14px; background: #fff; border-radius: 0 12px 12px 0; margin-bottom: 10px; }
.riesgo.n3 { border-left-color: var(--error); }
.riesgo.n2 { border-left-color: var(--boya); }
.riesgo.n1 { border-left-color: var(--alga); }
.riesgo h4 { margin: 0 0 4px; font-size: 18px; }
.riesgo .nivel { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--bruma); margin-left: 6px; vertical-align: 2px; }
.riesgo.n3 .nivel { background: var(--error-claro); color: var(--error); }
.riesgo.n2 .nivel { background: var(--boya-claro); color: #5c4700; }
.riesgo dl { margin: 6px 0 0; font-size: 15px; }
.riesgo dt { font-weight: 600; color: var(--fiordo-2); margin-top: 6px; }
.riesgo dd { margin: 0; }
.epp { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.epp span { background: #fde5d6; color: #7a3410; border-radius: 99px; padding: 3px 10px; font-size: 14px; }
.proc { border: 2px solid var(--bruma-2); border-radius: 14px; padding: 14px; margin-bottom: 12px; background: #fff; }
.proc h4 { margin: 0 0 6px; font-size: 18px; color: var(--fiordo); }
.proc ul { margin: 6px 0 8px; padding-left: 20px; }
.proc li { margin-bottom: 4px; }
.proc.leido { border-color: var(--alga); }
.roles li { margin-bottom: 6px; }
.directorio { display: grid; grid-template-columns: 1fr auto; gap: 0; font-size: 16px; }
.directorio div { padding: 8px 0; border-bottom: 1px solid var(--bruma-2); }
.directorio a { font-weight: 700; text-decoration: none; color: var(--fiordo); white-space: nowrap; }

/* firma */
.firma-caja { border: 2px dashed var(--fiordo-3); border-radius: 12px; background: #fff; touch-action: none; width: 100%; height: 180px; display: block; }

/* encuesta */
.escala { display: flex; gap: 6px; margin: 6px 0 16px; }
.escala button { flex: 1; min-height: 48px; border-radius: 10px; border: 2px solid var(--bruma-2); background: #fff; font-weight: 700; cursor: pointer; }
.escala button.sel { background: var(--fiordo-2); color: #fff; border-color: var(--fiordo-2); }
.escala-leyenda { display: flex; justify-content: space-between; font-size: 13px; color: var(--roca); margin-top: -12px; margin-bottom: 14px; }

.cert-caja { width: 100%; overflow: hidden; border: 1px solid var(--bruma-2); border-radius: 12px; background: #fff; position: relative; }
.cert-caja iframe { width: 820px; height: 1160px; border: 0; transform-origin: 0 0; position: absolute; left: 0; top: 0; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 12px 18px; border-radius: 12px; z-index: 60; max-width: 90vw; font-size: 15px; }
.cargando { text-align: center; padding: 40px 0; color: var(--roca); }
.pie { text-align: center; font-size: 13px; color: var(--roca); margin-top: 30px; }
.demo-banda { background: var(--boya); color: var(--tinta); text-align: center; font-size: 14px; padding: 6px 12px; }

/* logo de la empresa */
.logo-chip { width: 38px; height: 38px; border-radius: 9px; background: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
.logo-chip img { width: 32px; height: 30px; object-fit: contain; }
.logo-ingreso { display: block; width: 120px; height: auto; margin: 0 auto 14px; }
@media (max-width: 420px) { .marca { font-size: 19px; gap: 6px; } .barra-in { gap: 8px; } .btn-barra { padding: 6px 10px; } .estado-red { font-size: 12px; padding: 3px 7px; } }

/* catálogo de cursos y cápsulas */
.seccion { font-size: 20px; margin: 22px 0 8px; color: var(--fiordo-2); }
.curso { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff; border: 2px solid transparent; border-radius: 14px; padding: 14px; margin: 8px 0; cursor: pointer; box-shadow: var(--sombra); }
.curso:hover { border-color: var(--fiordo-3); }
.curso .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.curso .tt { font-weight: 600; line-height: 1.25; }
.curso .mt { font-size: 14px; color: var(--roca); }
.curso-ic { width: 42px; height: 42px; flex: none; border-radius: 12px; background: var(--bruma); color: var(--fiordo); display: flex; align-items: center; justify-content: center; }
.mini-barra { display: block; width: 100%; height: 6px; margin: 4px 0 2px; }
.ok-chip { background: var(--alga-claro); border-color: #b8ddd3; color: #1d5a4e; }
.diapo h2 { font-size: 26px; margin-top: 4px; }
.diapo p { font-size: 18px; line-height: 1.55; }
.diapo-l { padding-left: 22px; font-size: 17px; }
.diapo-l li { margin-bottom: 8px; }
.puntos { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 4px; }
.puntos i { width: 10px; height: 10px; border-radius: 50%; background: var(--bruma-2); }
.puntos i.vis { background: var(--fiordo-3); }
.puntos i.act { background: var(--chaleco); }
textarea { min-height: 120px; }

/* ajustes de la vista publicada */
.barra{top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--fiordo)}

</style>

<div id="demo-banda" class="demo-banda oculto">Modo demostración: los datos quedan solo en este navegador.</div>
<header class="barra"><div class="barra-in">
  <div class="marca"><span class="logo-chip"><img src="img/logo_gl.png" alt=""></span>GL Capacita</div>
  <div class="esp"></div>
  <span id="red" class="estado-red oculto"></span>
  <button id="btn-salir" class="btn-barra oculto" type="button">Salir</button>
</div></header>
<main id="app"><div class="cargando">Cargando…</div></main>

    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }

      return data;

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          for (var i = 0; i < rsBlocks.length; i++) {

      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';

      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +

      qrSvg += '<path d="';

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;

      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {

        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }

      return escaped;

      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {

        '█ ': '▀',
        ' █': '▄',
        '  ': ' '

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];

        ascii += '\n';

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');

      return ascii.substring(0, ascii.length-1);

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  qrcode.stringToBytesFuncs = {

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  intro: 'Este taller reemplaza "MIPER grupal" y "Mapa de riesgos en grupos". Vas a evaluar riesgos reales de tu cargo con la misma regla de la Matriz IPER de GL y a armar un mapa de riesgos.',
  partes: [
    { tipo: 'lectura', titulo: 'Cómo evalúa GL un riesgo', texto: 'Cada riesgo se evalúa multiplicando la Probabilidad (P) por la Severidad (S), según la guía del ISP.\n\nProbabilidad: Baja = 1, Media = 2, Alta = 4.\nSeveridad: Ligeramente dañino = 1 (lesiones superficiales), Dañino = 2 (laceraciones, quemaduras, esguinces), Extremadamente dañino = 4 (lesiones graves, amputaciones, muerte).\n\nResultado: 1 o 2 Tolerable · 4 Moderado · 8 Importante · 16 Intolerable. Con Importante o Intolerable no se comienza ni continúa el trabajo hasta reducir el riesgo.' },

    { t: 'Retirar la protección del esmeril porque molesta', c: 'no', fb: 'Prohibido retirar o anular protecciones.' },
    { t: 'Reclamar una multa ante la Inspección del Trabajo', c: 'si', fb: 'Es un derecho que te reconoce el Reglamento.' },
    { t: 'Desarmar un ROV con la batería conectada para ahorrar tiempo', c: 'no', fb: 'Prohibido intervenir equipos energizados.' }
  ] }] };
CONTENIDO.talleres['riohs.t1'] = function (cargo) {
  return { intro: 'Aplica el Reglamento a situaciones reales de tu trabajo. Tus respuestas quedan registradas para la Asesora en Prevención de Riesgos.', partes: [
    { tipo: 'lectura', titulo: 'Situación', texto: PLAN.area(cargo) === 'faena' ? 'Llevas 10 días de turno. Un trabajador del centro te pide que lo dejes manejar el ROV "un ratito" para grabar un video. El jefe de centro dice que no hay problema.' : PLAN.area(cargo) === 'taller' ? 'Un viernes en la tarde hay apuro por entregar un equipo. Un compañero propone desarmarlo sin desconectar la batería y fumar un cigarro adentro porque afuera llueve.' : 'Visitas una faena con un cliente. En el pontón nadie usa chaleco salvavidas y te ofrecen uno "si quieres".' },
    { tipo: 'abierta', p: '¿Qué dice el Reglamento sobre esta situación y qué haces tú?', min: 60, alApr: true, modelo: 'El Reglamento prohíbe facilitar equipos a personas no autorizadas, intervenir equipos energizados y fumar en lugares prohibidos, y obliga a usar el EPP. Lo correcto es negarse con respeto, explicar la norma y avisar a la Jefa de Operaciones si hay presión para incumplirla.' },
    { tipo: 'abierta', p: '¿Qué norma del Reglamento te parece más difícil de cumplir en tu trabajo y por qué? ¿Qué propondrías?', min: 40, alApr: true, modelo: 'Gracias. Las propuestas sirven para revisar el Reglamento y las condiciones de trabajo.' }
  ] };
};
CONTENIDO.quiz.riohs = { n: 6, preguntas: [
  { p: '¿Quién es la Encargada de Seguridad y Salud en el Trabajo de GL?', op: ['La Asesora externa', 'Mery Leal Vargas, Jefa de Operaciones', 'El jefe de centro de la mandante', 'El Delegado'], ok: 2, fbOk: 'Correcto.', fbNo: 'Es Mery Leal Vargas, Jefa de Operaciones.' },
  { p: '¿Por qué GL no tiene Comité Paritario?', op: ['Porque no es obligatorio en ninguna empresa', 'Porque ninguna faena reúne a más de 25 personas; por eso tiene Delegado de SST', 'Porque la mandante lo prohíbe', 'Porque es una empresa nueva'], ok: 2, fbOk: 'Correcto.', fbNo: 'Ninguna faena supera las 25 personas: por eso GL tiene Delegado de SST.' },
  { p: '¿Qué está prohibido según el RIOHS?', op: ['Usar el EPP', 'Trabajar bajo los efectos del alcohol o drogas', 'Avisar un incidente', 'Detener una tarea peligrosa'], ok: 2, fbOk: 'Correcto.', fbNo: 'Trabajar bajo los efectos del alcohol o drogas está prohibido.' },
  { p: 'Reincides en una falta al Reglamento. ¿Cuál es la multa máxima?', op: ['Un día de sueldo', 'Hasta el 25% de la remuneración diaria', 'El 50% del sueldo mensual', 'No hay multas'], ok: 2, fbOk: 'Correcto.', fbNo: 'La multa no puede exceder el 25% de la remuneración diaria.' },
  { p: 'Hay un riesgo grave e inminente en tu faena. ¿Qué te permite el Reglamento?', op: ['Nada: debes seguir hasta que te autoricen', 'Interrumpir el trabajo y alejarte, avisando de inmediato', 'Irte a tu casa sin avisar', 'Solo llamar a la mandante'], ok: 2, fbOk: 'Correcto (Código del Trabajo, art. 184 bis).', fbNo: 'Puedes interrumpir el trabajo y alejarte, avisando de inmediato.' },
  { p: '¿Dentro de qué plazo la empresa presenta la DIAT?', op: ['24 horas', '5 días', '30 días', 'Solo si el accidente es grave'], ok: 1, fbOk: 'Correcto.', fbNo: 'La DIAT se presenta dentro de 24 horas.' },
  { p: '¿Cuál es el peso máximo de carga manual por persona?', op: ['15 kg', '25 kg', '50 kg', 'No hay límite'], ok: 2, fbOk: 'Correcto (Ley 20.949).', fbNo: 'El máximo es 25 kg (20 kg para mujeres y menores de edad).' }
] };
CONTENIDO.firmas['riohs.f1'] = function () { return { texto: 'Declaro que recibí el Reglamento Interno de Orden, Higiene y Seguridad 2026 de ' + CONTENIDO.empresa.nombre + ', que se me explicó su contenido mediante esta capacitación y que me comprometo a cumplirlo.' }; };

/* =====================================================================
   LEY KARIN (Ley 21.643) · PROTOCOLO DE PREVENCIÓN DE GL
   ===================================================================== */
CONTENIDO.lecciones['karin.l1'] = { documento: 'pts/LEY-KARIN.pdf', diapositivas: [
  { t: 'Un trabajo libre de violencia', x: 'La Ley 21.643, conocida como Ley Karin, obliga a todas las empresas a prevenir, investigar y sancionar el acoso laboral, el acoso sexual y la violencia en el trabajo. GL tiene su Protocolo de prevención, actualizado en noviembre de 2026.', l: ['Aplica a todas las personas que trabajan o se relacionan con GL: gerencia, pilotos, taller, estudiantes en práctica, contratistas, mandantes, clientes y visitas.', 'Aplica en el taller, en las faenas, en las embarcaciones, en los traslados y también en los medios digitales (WhatsApp, correo, redes).'] },
  { t: 'Acoso sexual', x: 'Requerimientos de carácter sexual, por cualquier medio, no consentidos por quien los recibe, que amenazan o perjudican su situación laboral o sus oportunidades en el empleo.', l: ['Comentarios, insinuaciones o contacto físico de carácter sexual no deseado.', 'Envío de mensajes, fotos o videos sexuales.', 'Incluye el acoso por medios digitales.', 'La falta de consentimiento, la jerarquía y el aislamiento (por ejemplo, en una faena) son claves para evaluarlo.'] },
  { t: 'Acoso laboral', x: 'Toda agresión u hostigamiento, por cualquier medio, de la empresa o de uno o más trabajadores contra otro, una sola vez o de manera reiterada, que provoque menoscabo, maltrato o humillación, o que amenace o perjudique su situación laboral.', l: ['Basta una sola vez: ya no se exige que sea reiterado.', 'Ejemplos: humillar o gritar frente a otros, aislar a alguien, burlarse de su acento u origen, asignar tareas imposibles para que falle, difundir rumores.'] },
  { t: 'Violencia de terceros', x: 'Conductas que afectan a los trabajadores por parte de personas ajenas a la relación laboral: clientes, mandantes, proveedores, usuarios o visitas.', l: ['Ejemplo: un trabajador de la mandante te insulta o amenaza en el pontón.', 'En GL es especialmente relevante en las faenas y en la coordinación con los centros de cultivo.', 'También se denuncia y la empresa debe protegerte.'] },
  { t: 'Conductas incívicas y sexismo', l: ['Conductas incívicas: tratos descorteses o groseros que, aunque no busquen dañar, deterioran el respeto y pueden escalar a violencia.', 'Sexismo: expresiones o prácticas basadas en la idea de inferioridad por sexo o género, incluso como "bromas".', 'GL las gestiona como señales tempranas: se corrigen antes de que escalen.'] },
  { t: 'Los principios del protocolo', l: ['Confidencialidad y reserva.', 'Imparcialidad: quien investiga no depende de las partes.', 'Celeridad: dentro de los plazos legales.', 'Debido proceso: ambas partes son oídas.', 'No revictimización: no se hace repetir el relato ni se expone a la persona.', 'Protección: medidas de resguardo inmediatas, que no son una sanción anticipada.', 'Perspectiva de género.'] },
  { t: 'Tus derechos y deberes', l: ['Derecho a un trato respetuoso y libre de violencia.', 'Derecho a denunciar sin represalias.', 'Deber de tratar con respeto a todas las personas.', 'Deber de colaborar con las investigaciones con información veraz.', 'Deber de respetar la confidencialidad.', 'Deber de informar riesgos psicosociales que observes, sobre todo en faena.'] }
] };
CONTENIDO.juegos['karin.j1'] = { intro: 'Según la Ley Karin y el protocolo de GL, clasifica cada situación.', partes: [{ tipo: 'clasificar',
  categorias: [{ id: 'sex', nombre: 'Acoso sexual' }, { id: 'lab', nombre: 'Acoso laboral' }, { id: 'ter', nombre: 'Violencia de terceros' }, { id: 'no', nombre: 'No es acoso ni violencia' }],
  items: [
    { t: 'Un compañero te envía por WhatsApp fotos de carácter sexual que no pediste', c: 'sex', fb: 'Es acoso sexual, también por medios digitales.' },
    { t: 'Tu jefe te grita y te trata de inútil frente a todo el taller', c: 'lab', fb: 'Basta una vez si hay menoscabo o humillación: es acoso laboral.' },
    { t: 'Un trabajador del centro de cultivo te amenaza porque el ROV demoró la faena', c: 'ter', fb: 'Es violencia ejercida por un tercero (la mandante).' },
    { t: 'Tu jefa te pide corregir un informe técnico con errores, con respeto', c: 'no', fb: 'Corregir el trabajo con respeto es parte normal de la supervisión.' },
    { t: 'Dejan fuera a un compañero de toda la información de los turnos para que falle', c: 'lab', fb: 'Aislar a alguien para perjudicarlo es acoso laboral.' },
    { t: 'Un supervisor le insinúa a una estudiante en práctica que su evaluación depende de salir con él', c: 'sex', fb: 'Es acoso sexual, agravado por la relación de poder.' },
    { t: 'Un cliente insulta por teléfono a la Jefa de Operaciones', c: 'ter', fb: 'Es violencia de terceros; también se denuncia.' },
    { t: 'No te asignan horas extraordinarias porque no hay trabajo extra', c: 'no', fb: 'No es acoso si no hay trato hostil ni perjuicio intencional.' }
  ] }] };
CONTENIDO.lecciones['karin.l2'] = function (cargo) {
  return { documento: 'pts/LEY-KARIN.pdf', diapositivas: [
    { t: 'Cómo prevenimos en GL', l: ['Política de tolerancia cero al acoso y la violencia, y de buen trato.', 'Identificación de los riesgos psicosociales en la Matriz IPER.', 'Cuestionario CEAL-SM con apoyo de la ACHS.', 'Reglas de convivencia en faena y en el taller, y gestión de la carga de trabajo y los turnos.', 'Pautas para la relación con mandantes y clientes.', 'Capacitación anual y difusión de los canales de denuncia dos veces al año.'] },
    { t: 'Riesgos que GL reconoce', l: ['Turnos largos y alta exigencia: fatiga e irritabilidad.', 'Aislamiento en faena y dependencia de una sola jefatura.', 'Cultura técnica jerárquica que normaliza el trato hostil.', 'Presión de mandantes y clientes por plazos.', 'Convivencia en el espacio reducido del taller y relación jerárquica con los estudiantes en práctica, que requieren especial resguardo.'] },
    { t: 'Cómo denunciar', l: ['Por escrito al correo glroboticasubmarina@gmail.com (recomendado, deja registro).', 'En forma verbal ante la responsable del protocolo, Mery Leal Vargas, Jefa de Operaciones: se levanta un acta y recibes copia.', 'Teléfono de orientación: +56 9 7828 1635.', 'Canal alternativo, si la denuncia involucra a la Gerencia o a la Jefatura de Operaciones: la Asesora externa en Prevención de Riesgos, ' + CONTENIDO.empresa.apr + '.', 'Directamente en la Inspección del Trabajo, en cualquier momento.'], tip: 'Antes de denunciar puedes pedir orientación, sin contar detalles íntimos ni obligación de denunciar.' },
    { t: 'Qué debe tener la denuncia', l: ['Quiénes están involucrados.', 'Qué pasó, cuándo y dónde.', 'Testigos, si los hay.', 'Pruebas: mensajes, correos, audios o fotos.', 'Cómo te ha afectado.', 'Si falta algo, la denuncia se recibe igual y se completa después.'] },
    { t: 'Medidas de resguardo', x: 'Al recibir la denuncia, GL adopta de inmediato (su estándar es dentro de 24 horas) medidas para proteger a quien denuncia. No son sanciones.', l: ['Separar espacios, turnos o faenas.', 'Redistribuir la jornada o cambiar funciones temporalmente sin bajar el sueldo.', 'Instrucción de no contacto.', 'Atención psicológica temprana en la ACHS.'] },
    { t: 'Investigación y plazos', l: ['En 3 días la empresa decide si investiga internamente o envía los antecedentes a la Inspección del Trabajo.', 'La investigación es escrita, reservada y ambas partes son oídas.', 'Debe terminar en un máximo de 30 días.', 'El informe se envía a la Inspección del Trabajo, que tiene 30 días para pronunciarse.', 'La empresa aplica las medidas o sanciones dentro de 15 días desde que recibe el informe.'] },
    { t: 'Sanciones y reparación', l: ['Sanciones según el Reglamento Interno: amonestación verbal o escrita, multa, capacitación obligatoria, cambio de funciones o término del contrato en los casos graves.', 'Medidas de reparación: apoyo psicológico en la ACHS, reintegro protegido y ajustes en la organización del trabajo, con seguimiento a los 30, 60 y 90 días.'] },
    { t: 'Prohibidas las represalias', l: ['Nadie puede ser castigado por denunciar, por ser víctima o por declarar como testigo.', 'Son represalias: cambios arbitrarios de turno, aislamiento, quitar funciones, amenazas u hostigamiento.', 'Cualquier represalia se investiga con prioridad y puede ser una falta grave.'] }
  ] };
};
CONTENIDO.talleres['karin.t1'] = function (cargo) {
  var faena = PLAN.area(cargo) === 'faena';
  return { intro: 'Lee cada caso y responde como si te pasara a ti o a un compañero. Tus respuestas quedan registradas de forma reservada para la Asesora en Prevención de Riesgos.', partes: [
    { tipo: 'lectura', titulo: 'Caso 1', texto: faena ? 'Estás solo en una faena. Desde hace una semana un trabajador del centro hace comentarios sobre tu cuerpo y te escribe mensajes de noche. Te da vergüenza contarlo.' : 'Una estudiante en práctica te cuenta que un trabajador del taller le hace comentarios de carácter sexual y que le da miedo decirlo porque puede afectar su evaluación.' },
    { tipo: 'abierta', p: '¿Qué tipo de conducta es, qué canales existen y qué medidas de resguardo se podrían pedir?', min: 70, alApr: true, modelo: 'Es acoso sexual (o violencia de un tercero, si viene de la mandante). Se puede pedir orientación y denunciar por correo, en forma verbal ante la Jefa de Operaciones, por el canal alternativo de la Asesora o en la Inspección del Trabajo. Medidas: separar a las personas, cambiar faena o turno, no contacto y atención psicológica en la ACHS. Guardar los mensajes como prueba.' },
    { tipo: 'lectura', titulo: 'Caso 2', texto: 'En el grupo de WhatsApp del trabajo se burlan a diario de un compañero por su forma de hablar. Él no dice nada, pero cada vez participa menos.' },
    { tipo: 'abierta', p: '¿Es acoso laboral? ¿Qué puedes hacer tú como compañero?', min: 50, alApr: true, modelo: 'Puede ser acoso laboral: hay menoscabo y humillación por medios digitales. Como compañero: no participar, apoyar a la persona, orientarla sobre los canales y, si corresponde, informar a la responsable del protocolo. Los testigos también están protegidos contra represalias.' }
  ] };
};
CONTENIDO.quiz.karin = { n: 6, preguntas: [
  { p: 'Según la Ley Karin, ¿el acoso laboral exige que la conducta sea reiterada?', op: ['Sí, siempre', 'No: puede bastar una sola vez si provoca menoscabo, maltrato o humillación', 'Solo si hay testigos', 'Solo si es por escrito'], ok: 2, fbOk: 'Correcto.', fbNo: 'Puede bastar una sola vez.' },
  { p: 'Un trabajador de la mandante te insulta y amenaza en el pontón. ¿Qué es?', op: ['Un problema personal', 'Violencia en el trabajo ejercida por terceros, que puedes denunciar', 'Nada, porque no es de GL', 'Acoso sexual'], ok: 2, fbOk: 'Correcto.', fbNo: 'Es violencia de terceros y se denuncia.' },
  { p: '¿Cuál de estos NO es un canal de denuncia en GL?', op: ['El correo de la empresa', 'La Inspección del Trabajo', 'Un comentario en el grupo de WhatsApp de la faena', 'La Asesora externa (canal alternativo)'], ok: 3, fbOk: 'Correcto. La denuncia se hace por los canales formales.', fbNo: 'Un comentario en un grupo no es una denuncia.' },
  { p: '¿En cuánto tiempo debe terminar la investigación?', op: ['5 días', '15 días', '30 días como máximo', 'No hay plazo'], ok: 3, fbOk: 'Correcto.', fbNo: 'La investigación termina en un máximo de 30 días.' },
  { p: '¿Qué son las medidas de resguardo?', op: ['Una sanción anticipada para el denunciado', 'Medidas inmediatas para proteger a quien denuncia, como separar espacios o dar atención psicológica', 'Un trámite opcional', 'Medidas que se aplican al final'], ok: 2, fbOk: 'Correcto.', fbNo: 'Son medidas inmediatas de protección; no son sanciones.' },
  { p: '¿Qué pasa con quien denuncia o declara como testigo?', op: ['Se le cambia de faena como castigo', 'Está protegido: cualquier represalia está prohibida', 'Debe pagar la investigación', 'Pierde su turno'], ok: 2, fbOk: 'Correcto.', fbNo: 'Las represalias están prohibidas.' },
  { p: '¿Quién recibe la denuncia si involucra a la Jefatura de Operaciones?', op: ['La misma Jefa de Operaciones', 'La Asesora externa en Prevención de Riesgos o la Inspección del Trabajo', 'Nadie', 'La mandante'], ok: 2, fbOk: 'Correcto.', fbNo: 'Se usa el canal alternativo: la Asesora externa o la Inspección del Trabajo.' }
] };
CONTENIDO.firmas['karin.f1'] = function () { return { texto: 'Declaro que recibí el Protocolo de prevención del acoso sexual, laboral y la violencia en el trabajo (Ley 21.643) de ' + CONTENIDO.empresa.nombre + ', que conozco los canales de denuncia y las medidas de resguardo, y que me comprometo a mantener un trato respetuoso y libre de violencia.' }; };

/* =====================================================================
   CÓMO LEER LA MATRIZ IPER
   ===================================================================== */
CONTENIDO.lecciones['iper.l1'] = { diapositivas: [
  { t: '¿Qué es la Matriz IPER?', x: 'Es la herramienta que exige el D.S. 44 para Identificar Peligros y Evaluar Riesgos de cada tarea. La de GL es la versión 02 de noviembre de 2026, elaborada por la Asesora externa y aprobada por la Gerencia General.', l: ['Cubre las 23 tareas de los pilotos ROV en faena, las tareas del nuevo taller de mantención (incluido el estudiante en práctica) y las de la gerencia.', 'Se revisa cuando cambian las tareas, los equipos o después de un accidente: por eso se agregaron la estufa a parafina, la combustión lenta y la escalera del taller.'] },
  { t: 'Cómo se lee una fila', x: 'Cada fila sigue el mismo orden:', l: ['Puesto de trabajo → Tarea', 'Peligro: la fuente del daño', 'Riesgo: lo que puede pasar (código ISP)', 'Consecuencias: el daño posible', 'Evaluación P × S y nivel', 'Medidas de control y procedimiento', 'Riesgo residual: cómo queda después de controlar'], tip: 'Ejemplo real: Piloto ROV · Preparación del equipo y checklist · Borde de pontón y movimiento de la embarcación · Caídas al agua · Ahogamiento o hipotermia.' },
  { t: 'Peligro no es lo mismo que riesgo', l: ['Peligro: un aerosol junto al cautín, una batería de litio cargando, el borde del pontón.', 'Riesgo: la posibilidad de que ese peligro te dañe: incendio, quemadura, caer al agua.', 'El riesgo depende de qué tan probable es y de qué tan grave sería el daño.'] },
  { t: 'Probabilidad × Severidad', l: ['Probabilidad: Baja = 1, Media = 2, Alta = 4.', 'Severidad 1: ligeramente dañino (cortes, molestias).', 'Severidad 2: dañino (laceraciones, quemaduras, esguinces).', 'Severidad 4: extremadamente dañino (amputaciones, lesiones graves, muerte).'], tip: 'VEP = P × S. Ejemplo: incendio por soldar junto a aerosoles, P = 2 y S = 4 da 8.' },
  { t: 'Qué significa cada nivel', l: ['1 o 2 · Tolerable: no requiere mejorar la acción preventiva.', '4 · Moderado: hay que hacer esfuerzos para reducirlo.', '8 · Importante: no se debe comenzar ni continuar el trabajo hasta reducir el riesgo.', '16 · Intolerable: no se comienza ni continúa hasta reducirlo; si no es posible, el trabajo se prohíbe.'] },
  { t: 'Riesgos que se miden con protocolos', x: 'Algunos riesgos de salud no se evalúan con P × S sino con protocolos del Ministerio de Salud:', l: ['Radiación UV de los pilotos: Guía técnica de radiación UV (GL ya tiene el informe cualitativo).', 'Solventes, resinas y vapores: D.S. 594 y la HDS de cada producto.', 'Posturas en la consola, el banco y el microscopio, y traslado de maletas: TMERT y MMC.', 'Carga de trabajo, trabajo aislado y turnos 14x14: cuestionario CEAL-SM.', 'Violencia y acoso: protocolo Ley Karin.'] },
  { t: 'La jerarquía de controles', l: ['Eliminación: sacar el peligro (retirar inflamables del banco).', 'Sustitución: cambiarlo por algo menos peligroso (limpiacontactos sin n-hexano).', 'Ingeniería: gabinete de inflamables, extractor de humos, zona de carga no combustible.', 'Señalización y advertencia.', 'Administrativos: PTS, checklist, capacitación, supervisión, pausas.', 'EPP: lentes, guantes, chaleco salvavidas. Es la última barrera.'] },
  { t: 'Riesgo residual y personas', l: ['Después de aplicar los controles se evalúa de nuevo: es el riesgo residual.', 'La matriz considera a personas especialmente sensibles, como el estudiante en práctica, y aspectos sexogenéricos, como EPP de la talla real.', 'Si ves un peligro que no está en la matriz, avísale a la Jefa de Operaciones o a la Asesora: así se actualiza.'] }
] };
CONTENIDO.talleres['iper.t1'] = {
  intro: 'Evalúa riesgos reales de tu cargo con la regla P × S de GL y compara con lo que dice la matriz.',
  partes: [
    { tipo: 'vep', desdeIper: true, n: 3 },
    { tipo: 'abierta', p: 'Piensa en una tarea tuya que no esté en la matriz o que haya cambiado. ¿Qué peligro tiene y qué control propones?', min: 30, alApr: true,
      modelo: 'Gracias. Tu aporte queda registrado para la Asesora en Prevención de Riesgos y sirve para actualizar la Matriz IPER.' }
  ]
};
CONTENIDO.quiz.iper = { n: 6, preguntas: [
  { p: '¿Cuál es la diferencia entre peligro y riesgo?', op: ['Son lo mismo', 'El peligro es la fuente del daño; el riesgo es la posibilidad de que ese daño ocurra y su gravedad', 'El riesgo es la fuente; el peligro es la consecuencia', 'El peligro solo existe en el mar'], ok: 2, fbOk: 'Correcto.', fbNo: 'Peligro: la fuente (un aerosol junto al cautín). Riesgo: la posibilidad y gravedad del daño (incendio).' },
  { p: 'Una tarea tiene Probabilidad Media (2) y Severidad Extremadamente dañina (4). ¿Qué nivel tiene?', op: ['Tolerable', 'Moderado', 'Importante', 'Intolerable'], ok: 3, fbOk: 'Correcto: 2 × 4 = 8, Importante.', fbNo: '2 × 4 = 8: nivel Importante.' },
  { p: '¿Qué indica un riesgo Importante en la matriz de GL?', op: ['Se puede trabajar sin cambios', 'No se debe comenzar ni continuar el trabajo hasta reducir el riesgo', 'Solo hay que usar EPP', 'Hay que avisar a fin de mes'], ok: 2, fbOk: 'Correcto.', fbNo: 'Con nivel Importante no se comienza ni continúa hasta reducir el riesgo.' },
  { p: '¿Con qué protocolo se evalúan las posturas en la consola y en el banco de trabajo?', op: ['CEAL-SM', 'PREXOR', 'TMERT', 'Ley Karin'], ok: 3, fbOk: 'Correcto.', fbNo: 'Las posturas y movimientos repetitivos se evalúan con TMERT.' },
  { p: '¿Qué medida es un control de ingeniería?', op: ['Lentes de seguridad', 'Charla de seguridad', 'Gabinete metálico para inflamables', 'Letrero de advertencia'], ok: 3, fbOk: 'Correcto.', fbNo: 'El gabinete es un cambio físico: control de ingeniería.' },
  { p: '¿Qué es el riesgo residual?', op: ['El riesgo antes de evaluar', 'El riesgo que queda después de aplicar los controles', 'Un riesgo que no se puede medir', 'El riesgo de otra empresa'], ok: 2, fbOk: 'Correcto.', fbNo: 'Es el nivel que queda después de aplicar las medidas de control.' },

CONTENIDO.lecciones['iper.l2'] = { diapositivas: [
  { t: 'Probabilidad (P)', x: '¿Qué tan seguido puede ocurrir?', l: ['Baja = 1: rara vez.', 'Media = 2: varias veces.', 'Alta = 4: siempre o casi siempre.'] },
  { t: 'Severidad (S)', x: '¿Qué tan grave sería el daño?', l: ['Ligeramente dañino = 1: lesiones superficiales, molestias.', 'Dañino = 2: laceraciones, quemaduras, esguinces, fracturas menores.', 'Extremadamente dañino = 4: lesiones graves, amputaciones, muerte.'] },

/* La matriz completa del cargo, fila por fila */
CONTENIDO.lecciones['iper.lm'] = function (cargo) {
  var I = (window.IPER_EMPRESA || {})[cargo] || { riesgos: [], procesos: [] }, R = I.riesgos.slice();
  R.sort(function (a, b) { return (b.nivel || 0) - (a.nivel || 0); });
  var cuenta = {}; R.forEach(function (r) { cuenta[r.nivelTxt] = (cuenta[r.nivelTxt] || 0) + 1; });
  var tareas = []; R.forEach(function (r) { (r.tareas || []).forEach(function (t) { if (tareas.indexOf(t) < 0) tareas.push(t); }); });
  var d = [{ t: 'La Matriz IPER de tu cargo', x: 'Ahora vas a leer la matriz real de GL para el cargo de ' + _nombreCargo(cargo) + ': ' + R.length + ' riesgos en ' + tareas.length + ' tareas. Léela con ojo crítico: al final del curso te vamos a preguntar si falta algo y si las medidas sirven.',
    l: Object.keys(cuenta).map(function (k) { return k + ': ' + cuenta[k] + ' riesgo' + (cuenta[k] === 1 ? '' : 's'); }),
    tip: 'La matriz completa en Excel es un documento que tienes derecho a conocer: pídela a la Jefa de Operaciones o a la Asesora.' }];
  d.push({ t: 'Las tareas de tu cargo', l: tareas.slice(0, 14) });
  if (tareas.length > 14) d.push({ t: 'Más tareas de tu cargo', l: tareas.slice(14, 28) });
  R.forEach(function (r, i) {
    function grupo(et, a) { return (a || []).filter(Boolean).map(function (c) { return et + ': ' + c; }); }
    d.push({ t: 'Fila ' + (i + 1) + ' de ' + R.length + ' · ' + r.riesgo + (r.codigo ? ' (' + r.codigo + ')' : ''),
      x: 'Tipo: ' + (r.tipo || '—') + '\nTareas: ' + (r.tareas || []).join(' / ') + '\nPeligros: ' + (r.peligros || []).join(' / ') + '\nConsecuencias: ' + (r.consecuencias || []).join(' / '),
      l: [(r.p && r.s) ? 'Evaluación: P ' + r.p + ' × S ' + r.s + ' = ' + (r.p * r.s) + ' → ' + r.nivelTxt : 'Evaluación: ' + r.nivelTxt].concat(
        grupo('Eliminar', r.eliminacion), grupo('Sustituir', r.sustitucion), grupo('Ingeniería', r.ingenieria), grupo('Señalización', r.senalizacion), grupo('Administrativo', r.administrativo),
        r.eppItems && r.eppItems.length ? ['EPP: ' + r.eppItems.join(', ')] : [], r.pts && r.pts.length ? ['Procedimiento: ' + r.pts.join(', ')] : []) });
  });
  d.push({ t: 'Ahora te toca a ti', l: ['¿Hay alguna tarea que haces y que no aparece?', '¿Hay algún peligro que conoces y que no está?', '¿Alguna evaluación te parece muy baja o muy alta para lo que vives en terreno?', '¿Las medidas se cumplen de verdad? ¿Falta algún control o EPP?', 'Lo vas a responder en el taller «Revisa tu matriz».'] });
  return { diapositivas: d };
};

/* Revisión participativa de la matriz del cargo */
CONTENIDO.talleres['iper.t2'] = function (cargo) {

    { tipo: 'abierta', p: '¿Qué tarea, peligro o riesgo de tu trabajo NO está en la matriz? Descríbelo: qué haces, dónde y qué te podría pasar.', min: 30, alApr: true, modelo: 'Gracias. Cada riesgo nuevo que informas se evalúa y, si corresponde, se agrega a la matriz con sus controles.' },

    { tipo: 'abierta', p: '¿Alguna evaluación (P × S) te parece mal calculada para lo que vives en terreno? ¿Cuál y por qué?', min: 20, alApr: true, modelo: 'Gracias. Si la tarea se hace más seguido o con más peligro del registrado, la evaluación se revisa.' }

      top.map(riesgoHtml).join('') +
      (R.length > top.length ? '<details><summary class="btn btn-ter">Ver los ' + R.length + ' riesgos evaluados</summary>' + R.filter(function (r) { return top.indexOf(r) < 0; }).map(riesgoHtml).join('') + '</details>' : '') + '</section>' +
      '<section class="tarjeta"><h2>Tus procedimientos</h2><p class="peq suave">Lee los puntos clave de cada uno y márcalo. Puedes abrir el documento completo.</p>' +
      procs.map(function (p) {
        return '<div class="proc' + (leidos[p.id] || ok ? ' leido' : '') + '" data-proc="' + p.id + '"><h4>' + h(p.id) + ' · ' + h(p.titulo) + '</h4><ul>' + p.claves.map(function (c) { return '<li>' + h(c) + '</li>'; }).join('') + '</ul>' +
          (p.archivo ? '<a href="' + h(p.archivo) + '" target="_blank" rel="noopener">Abrir el documento completo</a>' : '') +
          '<label class="check"><input type="checkbox" data-leido="' + p.id + '"' + (leidos[p.id] || ok ? ' checked' : '') + (ok ? ' disabled' : '') + '><span>Leí los puntos clave</span></label></div>';
      }).join('') + '</section>' +
      '<section class="tarjeta"><h2>Números de emergencia</h2><div class="directorio">' + CONTENIDO.directorio.map(function (d) { return '<div>' + h(d.n) + '</div><div>' + (/^[+\d]/.test(d.t) ? '<a href="tel:' + h(d.t.replace(/\s/g, '')) + '">' + h(d.t) + '</a>' : '<b>' + h(d.t) + '</b>') + '</div>'; }).join('') + '</div></section>' +
      (ok ? '<div class="aviso ok">Ya confirmaste la revisión de esta información.</div><button class="btn btn-pri btn-bloque" type="button" data-volver>Seguir</button>' :
        '<section class="tarjeta"><label class="check"><input type="checkbox" id="decl"><span>Declaro que revisé los riesgos de mi cargo, sus medidas de control, mi rol en emergencias y los procedimientos indicados.</span></label><div id="msg-pyv"></div>' +
        '<button class="btn btn-pri btn-bloque" type="button" id="conf-pyv">Confirmar revisión</button></section>');
    enlazarVolver(); Tiempo.iniciar(e.id);
    if (ok) return;
    $$('[data-leido]').forEach(function (c) {
      c.addEventListener('change', function () { var L = local()[e.id] && local()[e.id].leidos || {}; L[c.dataset.leido] = c.checked; setLocal(e.id, { leidos: L }); c.closest('.proc').classList.toggle('leido', c.checked); });
    });
    $('#conf-pyv').addEventListener('click', function () {
      var falt = $$('[data-leido]').filter(function (c) { return !c.checked; });
      if (falt.length) { $('#msg-pyv').innerHTML = '<div class="aviso error">Te falta marcar ' + falt.length + ' procedimiento(s).</div>'; falt[0].closest('.proc').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      if (!$('#decl').checked) { $('#msg-pyv').innerHTML = '<div class="aviso error">Marca la declaración para confirmar.</div>'; return; }
      Tiempo.volcar();
      var det = { riesgos: R.slice(0, 40).map(function (r) { return { riesgo: r.riesgo, nivel: r.nivelTxt, controles: [].concat(r.administrativo.slice(0, 1), r.eppItems.slice(0, 3)).join('; ') }; }), pts: procs.map(function (p) { return p.id + ' ' + p.titulo; }) };
      if (prog(e.id).segundos < e.minMin * 60) { $('#msg-pyv').innerHTML = '<div class="aviso info">Tómate unos minutos más para revisar la información: llevas ' + mins(prog(e.id).segundos) + ' de ' + e.minMin + ' min.</div>'; return; }
      SRV.encolar({ tipo: 'completar', item: e.id, detalle: det }); setLocal(e.id, { estado: 'completado' }); SRV.enviar(S.token);
      toast('Revisión registrada.'); ir('ruta');
    });
  }

  /* ---------- sesiones prácticas ---------- */
  function vistaSesiones(e) {
    var P = S.perfil, R = reqDs44(), lista = P.sesiones || [];
    app.innerHTML = encabezadoEtapa(e) +
      '<section class="tarjeta"><p>El curso incluye ' + R.sesionesRequeridas + ' sesiones prácticas con la facilitadora: casos de GL, trabajo en grupo y práctica con extintores. Pueden ser presenciales en el taller o en línea con los pilotos en faena.</p>' +
      '<div class="chips"><span class="chip">Registradas <b>' + lista.length + ' de ' + R.sesionesRequeridas + '</b></span></div>' +
      (lista.length ? '<ul>' + lista.map(function (s) { return '<li>Sesión ' + h(s.sesionId) + ' · ' + h(s.fecha) + '</li>'; }).join('') + '</ul>' : '') + '</section>' +
      '<section class="tarjeta"><h2>Registrar mi asistencia</h2><p class="peq">La facilitadora te dará un código al inicio de la sesión.</p>' +
      '<label class="campo">Código de la sesión<input type="text" id="cod" maxlength="8" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:4px"></label>' +
      '<label class="campo" style="margin-bottom:6px">Tu firma</label><canvas class="firma-caja" id="firma" aria-label="Espacio para firmar con el dedo"></canvas>' +
      '<button type="button" class="btn btn-ter" id="borrar">Borrar firma</button><div id="msg-s"></div>' +
      '<button class="btn btn-pri btn-bloque" type="button" id="reg">Registrar asistencia</button></section>';
    enlazarVolver();
    var cv = $('#firma'), ctx = cv.getContext('2d'), firmado = false, dib = false;
    function ajustar() { var r = cv.getBoundingClientRect(); cv.width = r.width * 2; cv.height = r.height * 2; ctx.scale(2, 2); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = '#16262D'; }
    ajustar();
    function pos(ev) { var r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
    cv.addEventListener('pointerdown', function (ev) { dib = true; firmado = true; var p = pos(ev); ctx.beginPath(); ctx.moveTo(p[0], p[1]); cv.setPointerCapture(ev.pointerId); });
    cv.addEventListener('pointermove', function (ev) { if (!dib) return; var p = pos(ev); ctx.lineTo(p[0], p[1]); ctx.stroke(); });
    cv.addEventListener('pointerup', function () { dib = false; });
    $('#borrar').addEventListener('click', function () { ctx.clearRect(0, 0, cv.width, cv.height); firmado = false; });
    $('#reg').addEventListener('click', function () {
      var cod = $('#cod').value.trim(), msg = $('#msg-s');
      if (!cod) { msg.innerHTML = '<div class="aviso error">Escribe el código de la sesión.</div>'; return; }
      if (!firmado) { msg.innerHTML = '<div class="aviso error">Firma con tu dedo en el recuadro.</div>'; return; }
      if (!navigator.onLine && !SRV.demo) { msg.innerHTML = '<div class="aviso error">Necesitas señal para registrar la asistencia.</div>'; return; }
      this.disabled = true; var btn = this;
      SRV.llamar('asistencia', { token: S.token, codigo: cod, firma: cv.toDataURL('image/png') }).then(function (r) {
        btn.disabled = false;
        if (r.ok) { S.perfil = r.perfil; guardarSesion(); toast(r.mensaje || 'Asistencia registrada.'); vistaSesiones(e); }
        else msg.innerHTML = '<div class="aviso error">' + h(r.error || r.mensaje) + '</div>';
      }).catch(function () { btn.disabled = false; msg.innerHTML = '<div class="aviso error">No se pudo conectar. Inténtalo de nuevo.</div>'; });
    });
  }

  /* ---------- encuesta ---------- */
  function vistaEncuesta(e) {
    var ok = hecho(e.id), resp = {};
    app.innerHTML = encabezadoEtapa(e) + (ok ? '<div class="aviso ok">Gracias, ya respondiste la encuesta.</div><button class="btn btn-pri btn-bloque" type="button" data-volver>Seguir</button>' :
      '<section class="tarjeta"><p>Tu opinión es anónima para la evaluación del curso y nos ayuda a mejorarlo. De 1 (muy en desacuerdo) a 5 (muy de acuerdo).</p>' +
      CONTENIDO.encuesta.map(function (q) {
        if (q.tipo === 'texto') return '<label class="campo">' + h(q.p) + '<textarea rows="3" data-q="' + q.id + '"></textarea></label>';
        return '<div class="campo" style="font-weight:600">' + h(q.p) + '</div><div class="escala" data-esc="' + q.id + '">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-v="' + n + '">' + n + '</button>'; }).join('') + '</div><div class="escala-leyenda"><span>Muy en desacuerdo</span><span>Muy de acuerdo</span></div>';
      }).join('') + '<div id="msg-e"></div><button class="btn btn-pri btn-bloque" type="button" id="env-e">Enviar encuesta</button></section>');
    enlazarVolver(); if (ok) return; Tiempo.iniciar(e.id);
    $$('[data-esc]').forEach(function (g) { $$('button', g).forEach(function (b) { b.addEventListener('click', function () { resp[g.dataset.esc] = +b.dataset.v; $$('button', g).forEach(function (x) { x.classList.toggle('sel', x === b); }); }); }); });
    $('#env-e').addEventListener('click', function () {
      var faltan = CONTENIDO.encuesta.filter(function (q) { return q.tipo === 'escala' && !resp[q.id]; });
      if (faltan.length) { $('#msg-e').innerHTML = '<div class="aviso error">Responde todas las preguntas con nota.</div>'; return; }
      $$('[data-q]').forEach(function (t) { resp[t.dataset.q] = t.value.slice(0, 600); });
      Tiempo.volcar(); SRV.encolar({ tipo: 'encuesta', item: e.id, respuestas: resp }); setLocal(e.id, { estado: 'completado' }); SRV.enviar(S.token);
      toast('Encuesta enviada. ¡Gracias!'); ir('ruta');
    });
  }

  /* ---------- certificado ---------- */
  function vistaCertificado() {
    var cur = PLAN.curso(S.curso);
    app.innerHTML = '<button class="volver" type="button" data-volver>' + ic('atras', 18) + 'Volver al curso</button><h1>Mi certificado</h1><p class="suave">' + h(cur.titulo) + '</p><section class="tarjeta" id="cert"><div class="cargando">Preparando tu certificado…</div></section>';
    enlazarVolver();
    if (!navigator.onLine && !SRV.demo) { $('#cert').innerHTML = '<div class="aviso error">Necesitas señal para emitir o descargar el certificado.</div>'; return; }
    SRV.enviar(S.token).then(function () { return SRV.llamar('certificado', { token: S.token, curso: cur.id }); }).then(function (r) {
      if (!r.ok) {
        var falt = (r.faltan || []).map(function (id) { var e = PLAN.etapa(id); return '<li>' + h(e ? e.titulo : id) + '</li>'; }).join('');
        $('#cert').innerHTML = '<div class="aviso error">' + h(r.error || r.mensaje) + '</div>' + (falt ? '<p>Te falta:</p><ul>' + falt + '</ul>' : '') + '<p class="peq suave">Si completaste todo sin señal, espera a que se guarde tu avance y vuelve a intentarlo.</p>';
        return;
      }
      S.perfil = r.perfil; aplicarExtras(); guardarSesion();
      var c = r.certificado;
      $('#cert').innerHTML = '<p>Código <b>' + h(c.codigo) + '</b> · emitido el ' + fechaTxt(c.fechaEmision) + (c.vence ? ' · vigente hasta ' + fechaTxt(c.vence) : '') + '.</p>' +
        '<div class="cert-caja" id="cert-caja"><iframe id="cert-fr" title="Vista del certificado"></iframe></div>' +
        '<div class="fila-btn">' + (c.pdf ? '<a class="btn btn-pri" download="Certificado_' + h(c.codigo) + '.pdf" href="data:application/pdf;base64,' + c.pdf + '">Descargar PDF</a>' : '') +
        (SRV.demo ? '' : '<button class="btn ' + (c.pdf ? 'btn-sec' : 'btn-pri') + '" type="button" id="imp">Imprimir o guardar como PDF</button>') + '</div>' + (SRV.demo ? '<p class="peq suave">En la plataforma instalada el certificado se descarga en PDF y queda guardado en la carpeta del trabajador en Drive.</p>' : '') +
        (SRV.demo ? '' : '<p class="peq suave">El certificado queda guardado en el registro de la empresa y se puede verificar con su código QR.</p>');
      $('#cert-fr').srcdoc = c.html;
      var escalar = function () { var caja = $('#cert-caja'); if (!caja) return; var k = caja.clientWidth / 820; $('#cert-fr').style.transform = 'scale(' + k + ')'; caja.style.height = Math.round(1075 * k) + 'px'; };
      escalar(); window.addEventListener('resize', escalar);
      if ($('#imp')) $('#imp').addEventListener('click', function () { var w = $('#cert-fr').contentWindow; w.focus(); w.print(); });
    }).catch(function () { $('#cert').innerHTML = '<div class="aviso error">No se pudo conectar. Inténtalo de nuevo en un momento.</div>'; });
  }

  /* ---------- arranque ---------- */
  if (SRV.rev) {
    window.GL_REVISION = true;
    PLAN.etapas.forEach(function (e) { if (e.minMin) e.minMin = 0; });
    PLAN.cursos.forEach(function (c) { (c.etapas || []).forEach(function (e) { if (e.minMin) e.minMin = 0; }); });
    var bd = $('#demo-banda'); bd.innerHTML = '<b>Modo revisión</b> · sin tiempos y sin registro · <a href="#" id="rev-cargo">Cambiar de cargo</a>'; bd.classList.remove('oculto');
    $('#rev-cargo').addEventListener('click', function (ev) { ev.preventDefault(); salir(); });
  } else if (SRV.demo) $('#demo-banda').classList.remove('oculto');
  var ses = SRV.ls('glc_sesion');
  if (!ses && SRV.rev) vistaRevision();
  else if (ses && ses.token) {
    S.token = ses.token; S.perfil = ses.perfil; aplicarExtras(); $('#btn-salir').classList.remove('oculto'); red(); ir('cursos');
    if (navigator.onLine || SRV.demo) SRV.llamar('estado', { token: S.token }).then(function (r) {
      if (r.ok) { S.perfil = r.perfil; aplicarExtras(); limpiarLocalConfirmado(); guardarSesion(); if (S.vista === 'ruta') vistaRuta(); else if (S.vista === 'cursos') vistaCursos(); SRV.enviar(S.token); }
      else if (r.error === 'sesion') salir(true);
    }).catch(function () { });
  } else vistaIngreso();
  SRV.onCambio(function (r) { if (r && r.perfil) { guardarSesion(); if (S.vista === 'ruta') vistaRuta(); else if (S.vista === 'cursos') vistaCursos(); } });
})();

</script>
