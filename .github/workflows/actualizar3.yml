name: Instalar GL Capacita
on:
  push:
    paths: ['.github/workflows/actualizar3.yml']
permissions:
  contents: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar archivos de GL
        run: |
          curl -sSL https://codeload.github.com/pyvdesinfecciones2015-lab/pyv-capacita/tar.gz/f3a24947c3d4a1cf0323f1342656d3f04e75e146 -o gl.tgz
          mkdir /tmp/gl && tar xzf gl.tgz -C /tmp/gl --strip-components=1 && rm gl.tgz
          rm -f /tmp/gl/servidor_gl.gs
          cp -r /tmp/gl/. .
          git config user.name "GL Capacita"
          git config user.email "glcapacita@users.noreply.github.com"
          git add -A
          git commit -m "GL Capacita: Emergencias, EPP, Accidentes y procedimientos de 1 hora"
          git push
